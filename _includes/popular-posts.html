<section class="popular-posts" hidden>
  <h2 class="panel-heading">인기 글</h2>
  <ol class="popular-posts-list content mt-3 mb-1" style="padding-left: 1.2rem;"></ol>
</section>

<script>
  (function () {
    if (window.__popularPostsLoaded) return;
    window.__popularPostsLoaded = true;

    const GC = 'https://stellacustodis.goatcounter.com';
    const TOP_N = 10;
    const HOUR = 60 * 60 * 1000;
    const FRESH_TTL = 2 * HOUR;
    const STALE_TTL = FRESH_TTL + 24 * HOUR;
    const CACHE_KEY = 'popular-posts:v1';
    const MAX_PARALLEL = 6;
    const REQUEST_TIMEOUT = 4000;
    const ERROR_LIMIT = 3;

    const posts = [
      {%- for post in site.posts -%}
        {%- unless post.hidden -%}
          { path: {{ post.url | relative_url | jsonify }}, title: {{ post.title | jsonify }} },
        {%- endunless -%}
      {%- endfor -%}
    ];
    const postTitles = new Map(posts.map(({ path, title }) => [path, title]));

    function render(sections, top) {
      sections.forEach((section) => {
        const items = top.map(({ path, count }) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          const views = document.createElement('span');
          item.className = 'mb-1';
          link.href = path;
          link.textContent = postTitles.get(path);
          views.className = 'text-muted small';
          views.textContent = '(' + count.toLocaleString() + ')';
          item.append(link, ' ', views);
          return item;
        });
        section.querySelector('.popular-posts-list').replaceChildren(...items);
        section.hidden = items.length === 0;
      });
    }

    function readCache() {
      try {
        const cache = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (!cache || !Array.isArray(cache.top) || !Number.isFinite(cache.at)) return null;
        const age = Date.now() - cache.at;
        if (age < 0 || age >= STALE_TTL) return null;
        const top = cache.top.filter((result) =>
          result && postTitles.has(result.path) && Number.isFinite(result.count) && result.count > 0
        ).slice(0, TOP_N);
        return { fresh: age < FRESH_TTL, top };
      } catch (error) {
        return null;
      }
    }

    function writeCache(top) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), top }));
      } catch (error) { /* 저장소를 쓸 수 없어도 현재 결과는 표시한다. */ }
    }

    async function fetchCount(post, circuit) {
      /* relative_url이 만든 경로는 GoatCounter 저장 경로와 같다.
         start 파라미터는 과거에 캐시된 404를 우회하는 데 쓰인다. */
      const url = GC + '/counter/' + encodeURIComponent(post.path) + '.json?start=2026-01-01';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
      circuit.pending.add(controller);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (response.status === 429 || (response.status >= 500 && response.status < 600)) {
          circuit.errors += 1;
          if (circuit.errors === ERROR_LIMIT) {
            circuit.pending.forEach((request) => request.abort());
          }
        }
        if (response.status === 404) return { ...post, count: 0 };
        if (!response.ok) return null;
        const data = await response.json();
        const count = parseInt(String(data.count).replace(/[^0-9]/g, ''), 10);
        return Number.isFinite(count) ? { ...post, count } : null;
      } catch (error) {
        return null;
      } finally {
        clearTimeout(timeout);
        circuit.pending.delete(controller);
      }
    }

    async function fetchAll() {
      const circuit = { errors: 0, pending: new Set() };
      const results = [];
      let next = 0;

      async function worker() {
        while (next < posts.length && circuit.errors < ERROR_LIMIT) {
          const result = await fetchCount(posts[next++], circuit);
          if (result) results.push(result);
        }
      }

      await Promise.all(Array.from({ length: MAX_PARALLEL }, worker));
      const top = results.filter(({ count }) => count > 0)
        .sort((a, b) => b.count - a.count || a.path.localeCompare(b.path))
        .slice(0, TOP_N);
      return { complete: results.length === posts.length, top };
    }

    function startWhenVisible(panels, load) {
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          if (!entries.some((entry) => entry.isIntersecting && entry.intersectionRatio > 0)) return;
          observer.disconnect();
          load();
        }, { threshold: [0, 0.0001] });
        panels.forEach((panel) => observer.observe(panel));
        return;
      }

      function check() {
        const visible = panels.some((panel) => {
          const rect = panel.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.top < window.innerHeight &&
            rect.right > 0 && rect.left < window.innerWidth;
        });
        if (!visible) return;
        window.removeEventListener('scroll', check, true);
        window.removeEventListener('resize', check);
        document.removeEventListener('focusin', onFocus);
        load();
      }

      function onFocus() { requestAnimationFrame(check); }

      window.addEventListener('scroll', check, { capture: true, passive: true });
      window.addEventListener('resize', check);
      document.addEventListener('focusin', onFocus);
      check();
    }

    function init() {
      const sections = Array.from(document.querySelectorAll('.popular-posts'));
      const cached = readCache();
      if (cached) render(sections, cached.top);
      if (cached?.fresh || sections.length === 0) return;

      /* 검색 힌트와 사이드 패널은 한 번의 조회 결과를 공유한다. */
      const panels = sections.map((section) => section.parentElement).filter(Boolean);
      let started = false;
      startWhenVisible(panels, async () => {
        if (started) return;
        started = true;
        const result = await fetchAll();
        /* 불완전한 순위로 정상 캐시를 덮어쓰면 다음 방문에서도 오차가 이어진다. */
        if (result.complete) writeCache(result.top);
        if (result.complete || !cached?.top.length) render(sections, result.top);
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
    else init();
  })();
</script>
