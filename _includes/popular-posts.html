<!-- 인기 글 위젯(오른쪽 패널): GoatCounter 공개 카운터 API로 조회수를 조회해 Top N을 표시 (결과는 1시간 캐시) -->
<!-- 주의: Chirpy가 HTML을 한 줄로 압축하므로 아래 스크립트에 `//` 줄 주석을 쓰면 안 됨 -->
<section class="popular-posts" hidden>
  <h2 class="panel-heading">인기 글</h2>
  <ol class="popular-posts-list content mt-3 mb-1" style="padding-left: 1.2rem;"></ol>
</section>

<script>
  (function () {
    var GC = 'https://stellacustodis.goatcounter.com';
    var TOP_N = 10;

    if (window.__popularPostsLoaded) { return; }
    window.__popularPostsLoaded = true;

    var posts = [
      {%- for post in site.posts -%}
        {%- unless post.hidden -%}
          { path: {{ post.url | relative_url | jsonify }}, title: {{ post.title | jsonify }} },
        {%- endunless -%}
      {%- endfor -%}
    ];

    var TTL = 60 * 60 * 1000;
    var CACHE_KEY = 'popular-posts:v1';
    var MAX_PARALLEL = 6;
    var started = false;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render(top) {
      if (!top || top.length === 0) return;
      var html = top.map(function (r) {
        return '<li class="mb-1"><a href="' + esc(r.path) + '">' + esc(r.title) + '</a> ' +
               '<span class="text-muted small">(' + Number(r.count).toLocaleString() + ')</span></li>';
      }).join('');

      /* 위젯이 사이드 패널과 검색 힌트 패널 두 곳에 include되므로 모든 인스턴스를 채움 */
      document.querySelectorAll('.popular-posts').forEach(function (sec) {
        sec.querySelector('.popular-posts-list').innerHTML = html;
        sec.hidden = false;
      });
    }

    function readCache() {
      try {
        var c = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (c && Array.isArray(c.top) && Date.now() - c.at < TTL) return c.top;
      } catch (e) { /* 저장소를 못 쓰는 환경이면 매번 조회 */ }
      return null;
    }

    function writeCache(top) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), top: top })); } catch (e) { /* 무시 */ }
    }

    /* 섹션 자체는 채워지기 전까지 hidden이므로, 그것을 담은 패널이 화면에 있는지를 본다 */
    function panelVisible() {
      return Array.prototype.some.call(document.querySelectorAll('.popular-posts'), function (sec) {
        return sec.parentElement && sec.parentElement.getClientRects().length > 0;
      });
    }

    function fetchCount(p) {
      /* p.path는 relative_url이 이미 퍼센트 인코딩한 값이고 GoatCounter도 그 형태로 저장한다.
         여기에 encodeURI를 한 번 더 걸면 %EC가 %25EC가 되어 한글 경로가 전부 0으로 나온다.
         ?start=는 과거에 캐시된 404 응답(최대 4시간)을 우회하기 위한 고정 파라미터. */
      var url = GC + '/counter/' + encodeURIComponent(p.path) + '.json?start=2026-01-01';
      return fetch(url)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var n = d ? parseInt(String(d.count).replace(/[^0-9]/g, ''), 10) : 0;
          return { path: p.path, title: p.title, count: n || 0 };
        })
        .catch(function () { return { path: p.path, title: p.title, count: 0 }; });
    }

    /* 글마다 요청이 하나씩 필요하다. 한꺼번에 쏘지 않고 MAX_PARALLEL개씩만 보낸다 */
    function fetchAll() {
      var results = new Array(posts.length);
      var next = 0;
      function worker() {
        if (next >= posts.length) return Promise.resolve();
        var i = next++;
        return fetchCount(posts[i]).then(function (r) { results[i] = r; return worker(); });
      }
      var workers = [];
      for (var k = 0; k < MAX_PARALLEL; k++) { workers.push(worker()); }
      return Promise.all(workers).then(function () { return results; });
    }

    function load() {
      if (started || !panelVisible()) return;
      started = true;
      fetchAll().then(function (results) {
        results.sort(function (a, b) { return b.count - a.count; });
        var top = results.filter(function (r) { return r.count > 0; }).slice(0, TOP_N);
        writeCache(top);
        render(top);
      });
    }

    var cached = readCache();
    if (cached) { render(cached); return; }

    load();
    /* 좁은 화면에서는 패널이 없고, 검색창을 열 때 검색 힌트 쪽 위젯이 보인다 */
    document.addEventListener('focusin', function () { setTimeout(load, 300); });
    window.addEventListener('resize', function () { load(); });
  })();
</script>
